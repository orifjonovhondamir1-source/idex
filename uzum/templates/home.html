<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yo'l Taksi | Demo</title>
<style>
:root{--bg:#f3f4f6;--fg:#1b1f24;--muted:#6b7480;--card:#fff;--line:#e2e5ea;--sun:#ffcc00;--map:#e9edf2;--road:#fff;--ok:#12a150;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--fg:#eef1f4;--muted:#98a2ae;--card:#1b2026;--line:#2c333b;--map:#1f262d;--road:#2b343d}}
:root[data-theme="dark"]{--bg:#111418;--fg:#eef1f4;--muted:#98a2ae;--card:#1b2026;--line:#2c333b;--map:#1f262d;--road:#2b343d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.map{background:var(--map);position:relative;border-bottom:1px solid var(--line)}
.map svg{display:block;width:100%;height:auto}
.demo{position:absolute;top:10px;left:10px;background:var(--sun);color:#1b1f24;font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:12px}
.sheet{background:var(--card);border-radius:20px 20px 0 0;margin-top:-16px;position:relative;padding:18px 16px 24px;flex:1}
.row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
select{flex:1;min-width:0;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
h2{font-size:1rem;margin:16px 0 8px}
.tariff{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--fg);background:var(--bg);border:2px solid transparent;border-radius:14px;padding:12px;margin-bottom:8px;cursor:pointer}
.tariff[aria-pressed=true]{border-color:var(--sun)}
.tariff .ic{font-size:1.6rem}
.tariff b{display:block}
.tariff small{color:var(--muted)}
.tariff .pr{margin-left:auto;font-weight:700;white-space:nowrap}
.go{width:100%;border:0;background:var(--sun);color:#1b1f24;font:inherit;font-size:1.05rem;font-weight:700;padding:15px;border-radius:14px;cursor:pointer;margin-top:6px}
.go:disabled{opacity:.5;cursor:not-allowed}
.ghost{width:100%;border:1px solid var(--line);background:none;color:var(--fg);font:inherit;padding:12px;border-radius:14px;cursor:pointer;margin-top:8px}
.driver{display:flex;gap:12px;align-items:center;background:var(--bg);border-radius:14px;padding:14px;margin:10px 0}
.driver .av{width:48px;height:48px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-size:1.5rem;flex:none}
.plate{display:inline-block;border:2px solid var(--fg);border-radius:6px;padding:0 8px;font-weight:700;letter-spacing:.06em}
.info{color:var(--muted);font-size:.9rem;margin:6px 0}
.hide{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="map">
    <span class="demo">Demo: haqiqiy haydovchi chaqirilmaydi</span>
    <svg viewBox="0 0 320 210" role="img" aria-label="Toshkent xaritasi (soddalashtirilgan)">
      <rect width="320" height="210" fill="var(--map)"/>
      <g stroke="var(--road)" stroke-width="6" fill="none" stroke-linecap="round">
        <path d="M0 60H320M0 130H320M0 180H320M60 0V210M140 0V210M230 0V210M290 0V210"/>
      </g>
      <g id="places"></g>
      <path id="route" d="" fill="none" stroke="#1b1f24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1000" stroke-dashoffset="1000" style="transition:stroke-dashoffset .9s ease"/>
      <circle id="pa" r="7" fill="#12a150" stroke="#fff" stroke-width="3" class="hide"/>
      <circle id="pb" r="7" fill="#e5322d" stroke="#fff" stroke-width="3" class="hide"/>
      <text id="car" font-size="20" text-anchor="middle" class="hide">🚕</text>
    </svg>
  </div>

  <main class="sheet">
    <section id="order">
      <div class="row"><span class="dot" style="background:#12a150"></span><select id="from" aria-label="Qayerdan"></select></div>
      <div class="row"><span class="dot" style="background:#e5322d"></span><select id="to" aria-label="Qayerga"></select></div>
      <p class="info" id="meta">Manzillarni tanlang</p>
      <h2>Tarif</h2>
      <div id="tariffs"></div>
      <button class="go" id="go" disabled>Buyurtma berish</button>
    </section>

    <section id="wait" class="hide">
      <h2 id="wt">Haydovchi qidirilmoqda...</h2>
      <div class="driver hide" id="drv"></div>
      <p class="info" id="wi"></p>
      <button class="ghost" id="cancel">Bekor qilish</button>
    </section>
  </main>
</div>

<script>
(function(){
  var P=[
    {n:"Amir Temur xiyoboni",la:41.3111,lo:69.2797},
    {n:"Chorsu bozori",la:41.3265,lo:69.2347},
    {n:"Teleminora",la:41.3414,lo:69.2845},
    {n:"Mustaqillik maydoni",la:41.3252,lo:69.2838},
    {n:"Magic City",la:41.3379,lo:69.3109},
    {n:"Yunusobod metro",la:41.3647,lo:69.2897},
    {n:"Toshkent aeroporti",la:41.2579,lo:69.2811}
  ];
  var T=[
    {id:"e",n:"Ekonom",ic:"🚕",base:4000,km:2200,min:3,d:"Oddiy yo'l uchun"},
    {id:"c",n:"Komfort",ic:"🚙",base:7000,km:3200,min:5,d:"Keng salon, konditsioner"},
    {id:"b",n:"Biznes",ic:"🚘",base:12000,km:5000,min:8,d:"Premium avtomobil"}
  ];
  var $=function(i){return document.getElementById(i)};
  var sel=null,timer=null,anim=null;

  function xy(p){return [20+(p.lo-69.22)/(0.13)*280, 195-(p.la-41.25)/(0.13)*180]}
  function km(a,b){
    var R=6371,r=Math.PI/180,dl=(b.la-a.la)*r,dn=(b.lo-a.lo)*r;
    var h=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a.la*r)*Math.cos(b.la*r)*Math.sin(dn/2)*Math.sin(dn/2);
    return 2*R*Math.asin(Math.sqrt(h))*1.3; // yo'l egriligi uchun 1.3
  }
  function fmt2(n){return (Math.round(n/100)*100).toLocaleString('en-US').replace(/,/g,' ')+" so'm"}

  var pl=$("places");
  P.forEach(function(p){
    var c=xy(p),g=document.createElementNS("http://www.w3.org/2000/svg","circle");
    g.setAttribute("cx",c[0]);g.setAttribute("cy",c[1]);g.setAttribute("r",3.5);g.setAttribute("fill","#9aa4af");pl.appendChild(g);
  });
  [$("from"),$("to")].forEach(function(s,i){
    P.forEach(function(p,k){var o=document.createElement("option");o.value=k;o.textContent=p.n;s.appendChild(o)});
    s.selectedIndex=i===0?0:1;
  });

  function path(a,b){var A=xy(a),B=xy(b);return "M"+A[0]+" "+A[1]+"L"+B[0]+" "+A[1]+"L"+B[0]+" "+B[1]}

  function update(){
    var a=P[$("from").value],b=P[$("to").value],same=a===b;
    var A=xy(a),B=xy(b);
    $("pa").setAttribute("cx",A[0]);$("pa").setAttribute("cy",A[1]);$("pa").classList.remove("hide");
    $("pb").setAttribute("cx",B[0]);$("pb").setAttribute("cy",B[1]);$("pb").classList.toggle("hide",same);
    var r=$("route");
    if(same){r.setAttribute("d","");$("meta").textContent="Boshlang'ich va oxirgi manzil bir xil";$("tariffs").textContent="";$("go").disabled=true;return}
    r.style.transition="none";r.setAttribute("d",path(a,b));r.style.strokeDashoffset=1000;
    void r.getBoundingClientRect();r.style.transition="stroke-dashoffset .9s ease";r.style.strokeDashoffset=0;
    var d=km(a,b);
    $("meta").textContent="Taxminan "+d.toFixed(1)+" km, yo'lda ~"+Math.max(5,Math.round(d*2.4))+" daqiqa";
    var box=$("tariffs");box.textContent="";
    if(!sel)sel="e";
    T.forEach(function(t){
      var b2=document.createElement("button");b2.type="button";b2.className="tariff";b2.setAttribute("aria-pressed",t.id===sel);
      b2.innerHTML='<span class="ic">'+t.ic+'</span><span><b>'+t.n+'</b><small>'+t.d+' · '+t.min+' daqiqada keladi</small></span><span class="pr">'+fmt2(t.base+t.km*d)+'</span>';
      b2.onclick=function(){sel=t.id;update()};
      box.appendChild(b2);
    });
    $("go").disabled=false;
  }
  $("from").onchange=$("to").onchange=update;

  var NAMES=["Jasur","Bobur","Aziz","Sardor","Dilshod"],CARS=["Chevrolet Cobalt","Chevrolet Gentra","Kia K5","Chevrolet Malibu"];
  function plate(){var L="ABCDEFGH";return "01 "+(100+Math.floor(Math.random()*900))+" "+L[Math.floor(Math.random()*8)]+L[Math.floor(Math.random()*8)]+L[Math.floor(Math.random()*8)]}

  $("go").onclick=function(){
    $("order").classList.add("hide");$("wait").classList.remove("hide");
    $("wt").textContent="Haydovchi qidirilmoqda...";$("drv").classList.add("hide");$("wi").textContent="Atrofdagi mashinalar tekshirilmoqda";
    timer=setTimeout(function(){
      var t=T.filter(function(x){return x.id===sel})[0],a=P[$("from").value],A=xy(a);
      $("wt").textContent="Haydovchi topildi";
      $("drv").innerHTML='<span class="av">🧑‍✈️</span><span><b>'+NAMES[Math.floor(Math.random()*NAMES.length)]+'</b><br>'+CARS[Math.floor(Math.random()*CARS.length)]+'<br><span class="plate">'+plate()+'</span></span>';
      $("drv").classList.remove("hide");
      $("wi").textContent=t.min+" daqiqada yetib keladi. Bu demo, haqiqiy mashina kelmaydi.";
      var car=$("car"),k=0;car.classList.remove("hide");
      clearInterval(anim);
      anim=setInterval(function(){
        k+=1;var f=Math.min(k/40,1);
        car.setAttribute("x",A[0]-40*(1-f));car.setAttribute("y",A[1]+6);
        if(f>=1)clearInterval(anim);
      },60);
    },2000);
  };
  $("cancel").onclick=function(){
    clearTimeout(timer);clearInterval(anim);$("car").classList.add("hide");
    $("wait").classList.add("hide");$("order").classList.remove("hide");
  };
  update();
})();
</script>
</body>
</html>
